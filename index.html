<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رسالة لفاطمة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap">
<style>
:root{--sky:#14112e;--deep:#0b0920;--rose:#ff9db4;--petal:#ffd6df;--gold:#ffe3a3;--ink:#f6eefc;--d:'Aref Ruqaa','Amiri','Traditional Arabic',serif;--b:'Tajawal','Segoe UI',Tahoma,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,var(--sky),var(--deep));color:var(--ink);font-family:var(--b);overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scene{position:fixed;inset:0;z-index:1;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;gap:22px}
.scene.on{display:flex}
h1,h2,h3{font-family:var(--d);font-weight:700;margin:0;line-height:1.5}
h1{font-size:clamp(30px,8vw,52px)}h2{font-size:clamp(26px,7vw,42px)}h3{font-size:clamp(20px,5vw,26px)}
p{margin:0}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 28px;font-size:18px;color:var(--deep);background:var(--rose);text-decoration:none;display:inline-block;transition:transform .2s}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:active{transform:scale(.96)}
.env{width:min(78vw,300px);aspect-ratio:3/2;position:relative;background:var(--petal);border-radius:10px;box-shadow:0 20px 60px rgba(255,157,180,.25);padding:0}
.env::before{content:"";position:absolute;inset:0;border-radius:10px;background:rgba(255,157,180,.45);clip-path:polygon(0 0,100% 0,50% 62%)}
.seal{position:absolute;left:50%;top:50%;translate:-50% -50%;font-size:40px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{scale:1.18}}
.hint{opacity:.75;font-size:17px}
#yes{font-size:22px;padding:16px 38px;background:var(--gold);z-index:3}
#no{background:transparent;color:var(--ink);border:1.5px solid rgba(246,238,252,.5)}
.row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.slot{display:inline-block}
#note{min-height:1.6em;opacity:.8}
.heart{position:fixed;bottom:-48px;z-index:2;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) translateX(24px);opacity:.15}}
.say{font-family:var(--d);font-size:clamp(22px,5.6vw,32px);line-height:1.9;min-height:3.8em;max-width:18em}
.say.in{animation:fi .9s ease both}
@keyframes fi{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
#s5{justify-content:flex-start;overflow-y:auto;gap:54px;padding:calc(30px + env(safe-area-inset-top,0px)) 16px calc(80px + env(safe-area-inset-bottom,0px))}
.sec{position:relative;width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:16px;flex:none}
.card{background:rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;width:100%;line-height:1.9}
.rv{opacity:0;translate:0 16px;transition:opacity .8s,translate .8s}.rv.vis{opacity:1;translate:0 0}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.cnt div{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 4px}
.cnt b{display:block;font-family:var(--d);font-size:clamp(24px,7vw,34px);color:var(--gold)}
.cnt span{font-size:14px;opacity:.8}
.tl{position:relative;display:flex;flex-direction:column;width:100%;padding:8px 0}
.tl::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,157,180,.35);translate:-50% 0}
.it{position:relative;width:calc(50% - 20px);margin-bottom:24px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:16px;line-height:1.8;text-align:start}
.it:nth-child(odd){align-self:flex-start}.it:nth-child(even){align-self:flex-end}
.it::after{content:"";position:absolute;top:18px;width:14px;height:14px;border-radius:50%;background:var(--rose);box-shadow:0 0 12px var(--rose)}
.it:nth-child(odd)::after{inset-inline-end:-27px}.it:nth-child(even)::after{inset-inline-start:-27px}
.lts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lt{width:56px;height:64px;padding:0;font-family:var(--d);font-size:32px;background:var(--petal)}
.lt.on{background:var(--gold)}
.pair{display:flex;align-items:center;justify-content:center;gap:12px}
.ph{width:min(34vw,140px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--rose)}
.pulse{font-size:34px;animation:beat 1.4s ease-in-out infinite}
.strip{width:100%;border-radius:12px;display:block}
.open{clip-path:inset(0 50% 0 50%);transition:clip-path 1.8s ease}.vis .open{clip-path:inset(0 0 0 0)}
.verse{font-family:var(--d);font-size:clamp(22px,5.6vw,30px);line-height:2;background:linear-gradient(#f3e6c8,#e6d3a6);color:#3b2a14;border-radius:14px;padding:18px;width:100%}
.verse small{display:block;font-family:var(--b);font-size:14px;opacity:.75}
.verse em{font-style:normal;color:#b5532f}
.verse i{display:block;font-family:var(--b);font-style:normal;font-size:16px;margin-top:8px;color:#5a3d1c}
.dr{display:flex;gap:10px;align-items:flex-start;text-align:start}
.opt{display:block;width:100%;margin:8px 0;background:rgba(255,255,255,.1);color:var(--ink);font-size:17px}
.ok{background:#7fd6a0!important;color:var(--deep)!important}.bad{background:#f08a8a!important;color:var(--deep)!important}
.cp{width:100%;background:rgba(255,227,163,.12);border:1.5px dashed var(--gold);color:var(--ink);border-radius:14px;padding:14px;font-size:17px}
.cp.used{opacity:.5;text-decoration:line-through}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.mem button{aspect-ratio:1;padding:0;font-size:28px;background:rgba(255,255,255,.12);color:var(--ink)}
.mem button.f{background:var(--petal)}
.cert{background:linear-gradient(#f3e6c8,#e6d3a6);color:#3b2a14;border-radius:14px;padding:18px;width:100%;text-align:start;line-height:2}
.cert h2{text-align:center;color:#8a3b2a}
canvas.sg{width:100%;height:110px;background:rgba(255,255,255,.55);border-radius:10px;touch-action:none}
.stamp{display:none;font-family:var(--d);color:#b5342f;border:3px solid #b5342f;border-radius:12px;padding:6px 16px;rotate:-8deg;font-size:28px}
#letter{font-family:var(--d);font-size:clamp(21px,5.2vw,28px);line-height:2;white-space:pre-wrap;min-height:10em}
#letter .c{display:inline-block;width:2px;height:1em;background:var(--gold);vertical-align:-.12em;margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hid{position:absolute;font-size:20px;opacity:.3;background:none;color:var(--rose);padding:4px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:9;background:var(--gold);color:var(--deep);border-radius:14px;padding:12px 18px;max-width:86vw;text-align:center;display:none}
@media (prefers-reduced-motion:reduce){.seal,.pulse,.say.in,#letter .c{animation:none}.open{clip-path:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>

<section class="scene on" id="s1">
  <h1>فيه رسالة مستنياكِ</h1>
  <button class="env" id="open" aria-label="افتحي الرسالة"><span class="seal">❤</span></button>
  <p class="hint">دوسي على الظرف</p>
</section>

<section class="scene" id="s2">
  <h2>تقبلي تكوني حبيبتي للأبد؟</h2>
  <div class="row">
    <span class="slot"><button id="yes">أيوه</button></span>
    <span class="slot"><button id="no">لأ</button></span>
  </div>
  <p id="note"></p>
</section>

<section class="scene" id="s3">
  <h1 id="nm"></h1>
  <p id="say" class="say" aria-live="polite"></p>
  <button id="voice" hidden>اسمعي رسالتي 🎧</button>
  <button id="next" hidden>كمّلي</button>
</section>

<section class="scene" id="s5"></section>

function write(txt){const el=$("letter");el.textContent="";const c=document.createElement("span");c.className="c";const n=document.createTextNode("");el.append(n,c);let i=0;(function k(){if(i>=txt.length)return;const ch=txt[i++];n.data+=ch;setTimeout(k,/[،.!؟\n]/.test(ch)?380:65)})()}
function quiz(b){let i=0,sc=0;(function q(){if(i>=QUIZ.length){b.innerHTML="<h3>"+(sc>=6?"عارفاني أكتر من نفسي ❤":"حلو! بس لازم نتكلم أكتر 😉")+"</h3><p>نتيجتك "+ar(sc)+" من "+ar(QUIZ.length)+"</p>";return}
const[x,o,c]=QUIZ[i];b.innerHTML="<p>"+ar(i+1)+" / "+ar(QUIZ.length)+"</p><h3>"+x+"</h3>";
o.forEach((t,j)=>{const e=document.createElement("button");e.className="opt";e.textContent=t;e.onclick=()=>{b.querySelectorAll(".opt").forEach(z=>z.disabled=true);e.classList.add(j===c?"ok":"bad");if(j!==c)b.querySelectorAll(".opt")[c].classList.add("ok");else sc++;i++;setTimeout(q,1100)};b.append(e)})})()}
function mem(g,m){const E=["❤","⭐","📚","✈","🎬","🌙"],d=[...E,...E].sort(()=>Math.random()-.5);let a=null,lock=false,ok=0;
d.forEach(v=>{const b=document.createElement("button");b.dataset.v=v;b.textContent="؟";b.onclick=()=>{if(lock||b.classList.contains("f"))return;b.classList.add("f");b.textContent=v;if(!a){a=b;return}
if(a.dataset.v===v){a=null;if(++ok===6)m.textContent="كمّلتيها! زي ما هنكمّل مع بعض ❤"}else{lock=true;const p=a;a=null;setTimeout(()=>{p.classList.remove("f");b.classList.remove("f");p.textContent=b.textContent="؟";lock=false},800)}};g.append(b)})}
function sign(s){const c=s.querySelector("canvas"),g=c.getContext("2d");let dr=false,ink=false;g.strokeStyle="#3b2a14";g.lineWidth=3;g.lineCap="round";
const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{dr=ink=true;g.beginPath();g.moveTo(...P(e));c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(dr){g.lineTo(...P(e));g.stroke()}};c.onpointerup=c.onpointercancel=()=>{dr=false};
$("sgb").onclick=()=>{if(!ink){toast("وقّعي الأول بصباعك ✍");return}$("stp").style.display="inline-block";$("sgb").hidden=true}}
